<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            padding: 0;
            margin: 0;
            background-image: linear-gradient(90deg, rgb(78, 35, 50),rgb(85, 53, 80));
        }
        .container{
            background-color: rgb(78, 35, 50);
            width: 30vw;
            height: 25vh;
            text-indent: 30px;
            padding: 10px 10px;
            transform: translate(100%,100%);
            color: aliceblue;
            border: 1px solid rgb(78, 35, 50);
            border-radius: 20px;
            box-shadow: 0px 20px 20px black;
        }
        input[type=text]{
            width: 25vw;
            background-color: whitesmoke;
            height: 4vh;
            outline: none;
            border:none;
        }
        .btn{
            width: 10vw;
            position: relative;
            left: 9vw;
            top: 4vh;
            height: 5vh;
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="text">
            <input type="text" id="inp">
        </div>
        <button class="btn" id="btn">Generate</button>
        <button class="btn" id="btn3">Copy</button>
    </div>
    <script>
        let btn1=document.getElementById("btn")
        let btn2=document.getElementById("inp")
        let btn3=document.getElementById("btn3")

        let len=12

        let upercase="ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        let lowercase="abcdefghijklmnopqrstuvwxyz"
        let num="1234567890"
        let sym="!@#~$%^&*(_+<>?/)"
        let all=upercase+lowercase+num+sym
        
        let perform=()=>{
            let pass=""
            pass+=upercase[Math.floor(Math.random()*upercase.length)]
            pass+=lowercase[Math.floor(Math.random()*lowercase.length)]
            pass+=num[Math.floor(Math.random()*num.length)]
            pass+=sym[Math.floor(Math.random()*sym.length)]
            
            while(len>pass.length){
                pass+=all[Math.floor(Math.random()*all.length)]
    
            }
            inp.value=pass

        // alert('Hello')
        }
        let copyy=()=>{
            navigation.clipboard.writeText(btn2.value)
            alert(`You Copied ${btn2.value}`)
            alert('Hello')
        }
        btn1.addEventListener("click",()=>{
            perform()
        }
    )
        btn3.addEventListener("click",()=>{
            copyy()
        }
    )
    </script>
</body>
</html>
